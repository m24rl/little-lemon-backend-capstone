services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: littlelemon_capstone
      MYSQL_USER: littlelemon
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
